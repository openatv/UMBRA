name: Umbra translations

on:
  push:
    branches: [main]
    paths:
      - 'usr/lib/enigma2/python/Plugins/Extensions/UmbraSettings/*.py'
      - 'locale/**'
      - 'VERSION'
      - 'setup_translate.py'
      - '.github/workflows/translations.yml'
  pull_request:
    paths:
      - 'usr/lib/enigma2/python/Plugins/Extensions/UmbraSettings/*.py'
      - 'locale/**'
      - 'VERSION'
      - 'setup_translate.py'
      - '.github/workflows/translations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install Babel==2.17.0
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: python setup_translate.py all
      - run: python setup_translate.py all --check

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install Babel==2.17.0
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: python setup_translate.py all
      - run: python setup_translate.py all --check
      - name: Commit translation sources only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- locale
          if ! git diff --cached --quiet; then
            git commit -m 'Update Umbra translation catalogs'
            git push origin HEAD:main
          fi
